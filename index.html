<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FastMenu ESPE - Inicia sesión para pedir tu comida sin hacer filas en la universidad.">
    <title>Inicio de Sesión - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="imagenes/logo/iconos/Icono-FastMenu.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <header>
        <h1>Inicio de Sesión</h1>
    </header>

    <main>
        <section id="login-form">
            <img src="imagenes/logo/fastfood-logo.jpg" alt="Logo de FastMenu ESPE" width="120">

            <p>¡Pide tu comida sin hacer filas en la universidad!</p>

            <!-- El formulario ya no redirige por atributo action; el JS lo maneja -->
            <form id="formulario-login" novalidate>
                <p>
                    <label for="usuario">Usuario o Correo:</label>
                    <input type="text" id="usuario" name="usuario" required
                        placeholder="Ej: abperez o usuario@espe.edu.ec">
                </p>
                <p>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="8" maxlength="16" required
                        placeholder="********">
                </p>
                <div>
                    <label><input type="checkbox" id="recordarme" name="recordarme"> Recordarme</label>
                    <a href="#">¿Olvidaste tu clave?</a>
                </div>
                <button type="submit" class="btn-ingresar" id="btn-ingresar">Ingresar</button>
            </form>
        </section>

        <section id="registro-link">
            <p>¿No tienes una cuenta? <a href="pages/registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Toastify -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Módulos propios -->
    <script src="js/almacenamiento.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/componentes.js"></script>
    <script>
        // Lógica del inicio de sesión
        document.addEventListener("DOMContentLoaded", function() {
            // Cargar datos en localStorage si aún no existen
            cargarUsuarios().catch(function(error) {
                console.warn("No se pudo precargar usuarios:", error);
            });

            var formularioLogin = document.getElementById("formulario-login");
            if (formularioLogin !== null) {
                formularioLogin.addEventListener("submit", function(evento) {
                    evento.preventDefault();

                    var usuario   = document.getElementById("usuario").value.trim();
                    var password  = document.getElementById("password").value;
                    var recordar  = document.getElementById("recordarme").checked;

                    if (campoEstaVacio(usuario) || campoEstaVacio(password)) {
                        mostrarNotificacion("Por favor ingresa tu usuario y contraseña.", "advertencia");
                        return;
                    }

                    // Buscar el usuario en localStorage
                    var usuarios = obtenerDeStorage(CLAVE_USUARIOS);
                    if (usuarios === null) {
                        usuarios = [];
                    }

                    var usuarioEncontrado = null;
                    for (var u of usuarios) {
                        var coincideEmail  = u.email    === usuario;
                        var coincideCedula = u.cedula   === usuario;
                        var coincidePass   = u.password === password;

                        if ((coincideEmail || coincideCedula) && coincidePass) {
                            usuarioEncontrado = u;
                            break;
                        }
                    }

                    if (usuarioEncontrado !== null) {
                        // Guardar la sesión activa
                        guardarUsuarioActivo(usuarioEncontrado);
                        mostrarNotificacion("¡Bienvenido/a, " + usuarioEncontrado.nombres + "!", "exito");

                        // Redirigir después de un breve instante
                        setTimeout(function() {
                            window.location.href = "pages/principal.html";
                        }, 1200);

                    } else {
                        // Permitir acceso de invitado si el campo no está vacío (modo demo)
                        mostrarNotificacion("¡Bienvenido! Entrando en modo invitado.", "info");
                        setTimeout(function() {
                            window.location.href = "pages/principal.html";
                        }, 1200);
                    }
                });
            }
        });
    </script>
</body>

</html>
