<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administración del catálogo de productos de FastMenu ESPE. Agregar, editar y eliminar productos del menú.">
    <title>Catálogo - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="../imagenes/logo/iconos/Icono-FastMenu.ico">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/catalogo.css">
</head>

<body>

    <header>
        <h1>Gestión del Catálogo</h1>
        <img src="../imagenes/logo/fastfood-logo.jpg" alt="Logo FastMenu ESPE" width="80">
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid justify-content-center">
            <span class="navbar-brand d-lg-none text-white fw-bold">FastMenu ESPE</span>
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="principal.html"><i class="fas fa-home"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pedido.html">
                            <i class="fas fa-shopping-cart"></i> Mi pedido
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="catalogo.html">
                            <i class="fas fa-cog"></i> Catálogo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html"><i class="fas fa-users"></i> Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html"><i class="fas fa-envelope"></i> Contacto</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>

        <!-- Formulario para agregar / editar productos -->
        <section id="seccion-formulario-producto">
            <h2 id="titulo-formulario-prod">Agregar nuevo producto</h2>

            <form id="formulario-producto" novalidate>
                <div class="grid-formulario-prod">
                    <p>
                        <label for="prod-nombre">Nombre: <span class="obligatorio">*</span></label>
                        <input type="text" id="prod-nombre" placeholder="Ej: Arroz con pollo" required>
                    </p>
                    <p>
                        <label for="prod-precio">Precio ($): <span class="obligatorio">*</span></label>
                        <input type="number" id="prod-precio" placeholder="Ej: 2.50" min="0.01" step="0.01" required>
                    </p>
                    <p>
                        <label for="prod-stock">Stock: <span class="obligatorio">*</span></label>
                        <input type="number" id="prod-stock" placeholder="Ej: 20" min="0" required>
                    </p>
                    <p>
                        <label for="prod-categoria">Categoría: <span class="obligatorio">*</span></label>
                        <select id="prod-categoria" required>
                            <option value="">-- Selecciona categoría --</option>
                        </select>
                    </p>
                    <p>
                        <label for="prod-estado">Estado:</label>
                        <select id="prod-estado">
                            <option value="disponible">Disponible</option>
                            <option value="agotado">Agotado</option>
                        </select>
                    </p>
                    <p class="full-width">
                        <label for="prod-imagen">Ruta de imagen:</label>
                        <input type="text" id="prod-imagen"
                            placeholder="Ej: ../imagenes/menu/almuerzos/arroz-con-camaron.jpg">
                    </p>
                    <p class="full-width">
                        <label for="prod-descripcion">Descripción: <span class="obligatorio">*</span></label>
                        <textarea id="prod-descripcion" rows="3" placeholder="Describe el producto..." required></textarea>
                    </p>
                </div>

                <div class="botones-formulario-prod">
                    <button type="submit" id="btn-guardar-producto" class="btn-guardar">
                        <i class="fas fa-plus"></i> Agregar producto
                    </button>
                    <button type="button" id="btn-cancelar-edicion" class="btn-cancelar-form">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Panel de búsqueda y herramientas del catálogo -->
        <section id="herramientas-catalogo">
            <div class="barra-catalogo">
                <p id="contador-productos-admin" class="contador-catalogo">Cargando...</p>

                <div class="grupo-busqueda">
                    <label for="busqueda-catalogo"><i class="fas fa-search"></i></label>
                    <input type="text" id="busqueda-catalogo"
                        placeholder="Buscar producto en el catálogo..." autocomplete="off">
                </div>

                <button id="btn-restablecer-catalogo" class="btn-restablecer">
                    <i class="fas fa-redo"></i> Restablecer desde JSON
                </button>
            </div>
        </section>

        <!-- Contenedor del catálogo (se llena dinámicamente) -->
        <section id="seccion-catalogo">
            <div id="contenedor-catalogo" class="grid-catalogo">
                <!-- Las tarjetas de admin se generan aquí con JavaScript -->
            </div>
        </section>

    </main>

    <footer>
        <p>Copyright &copy; 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Toastify -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Módulos propios -->
    <script src="../js/almacenamiento.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/componentes.js"></script>
    <script src="../js/catalogo.js"></script>
</body>

</html>
