<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de nuevos usuarios en FastMenu ESPE. Crea tu cuenta para pedir comida sin hacer filas.">
    <title>Registro - FastMenu ESPE</title>
    <link rel="icon" type="image/x-icon" href="../imagenes/logo/iconos/Icono-FastMenu.ico">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Toastify CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

    <header>
        <h1>Formulario de Registro</h1>
    </header>

    <main>
        <section id="formulario-registro">
            <p>Completa tus datos para disfrutar de nuestros beneficios.</p>

            <form id="formulario-registro" class="formulario-registro" novalidate>

                <fieldset>
                    <legend>Datos Personales</legend>
                    <p>
                        <label for="nombres">Nombres: <span class="obligatorio">*</span></label>
                        <input type="text" id="nombres" name="nombres" required placeholder="Ej: Juan Carlos">
                    </p>
                    <p>
                        <label for="apellidos">Apellidos: <span class="obligatorio">*</span></label>
                        <input type="text" id="apellidos" name="apellidos" required placeholder="Ej: Pérez Gómez">
                    </p>
                    <p>
                        <label for="cedula">Cédula: <span class="obligatorio">*</span></label>
                        <input type="text" id="cedula" name="cedula" maxlength="10" required placeholder="1700000000">
                    </p>
                    <p>
                        <label for="fecha_nacimiento">Fecha de Nacimiento: <span class="obligatorio">*</span></label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </p>
                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="09XXXXXXXX">
                    </p>
                    <p class="full-width">
                        <label for="genero">Género: <span class="obligatorio">*</span></label>
                        <select id="genero" name="genero" required>
                            <option value="">-- Selecciona --</option>
                            <option value="masculino">Masculino</option>
                            <option value="femenino">Femenino</option>
                            <option value="otro">Otro</option>
                        </select>
                    </p>

                    <!-- Selector de nacionalidad con API de países -->
                    <p class="full-width selector-pais-contenedor">
                        <label for="buscar-pais">Nacionalidad: <span class="obligatorio">*</span></label>
                        <input type="text" id="buscar-pais" autocomplete="off"
                            placeholder="Cargando países..." aria-label="Buscar país de nacionalidad">
                        <!-- Lista desplegable de países (se llena con JS) -->
                        <ul id="lista-paises" class="lista-paises-dropdown" role="listbox"></ul>
                        <!-- Campo oculto que guarda el país seleccionado como texto -->
                        <input type="hidden" id="pais-seleccionado" name="pais-seleccionado">
                        <!-- Campo oculto con el objeto completo en JSON -->
                        <input type="hidden" id="nacionalidad" name="nacionalidad">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Datos de Cuenta</legend>
                    <p class="full-width">
                        <label for="email">Correo Electrónico Institucional: <span class="obligatorio">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="usuario@espe.edu.ec">
                    </p>
                    <p class="full-width">
                        <label for="password">Contraseña: <span class="obligatorio">*</span></label>
                        <input type="password" id="password" name="password" minlength="8" maxlength="16" required
                            placeholder="Mínimo 8 caracteres">
                    </p>
                    <p class="full-width terms-field">
                        <label>
                            <input type="checkbox" id="terminos" required name="terminos">
                            Acepto los <a href="#">términos y condiciones</a>
                        </label>
                    </p>
                </fieldset>

                <button type="submit" class="btn-registrar border-0" id="btn-submit-registro">
                    <i class="fas fa-user-plus"></i> Completar Registro
                </button>
            </form>
        </section>

        <section id="login-link">
            <p>¿Ya tienes una cuenta? <a href="../index.html">Inicia Sesión aquí</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright &copy; 2026 FastMenu ESPE. Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Toastify -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- Módulos propios -->
    <script src="../js/almacenamiento.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/componentes.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/registro.js"></script>
</body>

</html>
